<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чек-лист — начало работы (шаг 2)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }
        .sheet {
            max-width: 700px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .sheet-header {
            background: #FFFFFF;
            padding: 12px 16px;
            border-bottom: 1px solid #E2E9F2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .sheet-header h2 { font-size: 1.1rem; font-weight: 600; color: #1f2f3e; }
        .pdf-btn {
            background: #2c5f8a;
            color: white;
            border: none;
            padding: 5px 14px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .sheet-content { padding: 16px; background: #FFFFFF; }
        .section {
            background: #F2F4F8;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
            border-left: 3px solid #C3D7FF;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .section-title { font-weight: 700; font-size: 0.85rem; color: #1f2f3e; }
        .hint-icon {
            font-size: 1rem;
            cursor: pointer;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .tooltip {
            position: relative;
            display: inline-flex;
            cursor: pointer;
        }
        .tooltip .tooltip-text {
            visibility: hidden;
            background-color: #1f2f3e;
            color: #fff;
            text-align: left;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.7rem;
            position: absolute;
            z-index: 100;
            top: 50%;
            right: 100%;
            transform: translateY(-50%);
            margin-right: 10px;
            white-space: normal;
            min-width: 220px;
            max-width: 300px;
            word-break: break-word;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            line-height: 1.4;
        }
        .tooltip .tooltip-text ul {
            margin: 4px 0 4px 16px;
            padding-left: 0;
        }
        .tooltip .tooltip-text li {
            margin: 2px 0;
        }
        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        .stages-compact {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .stage-line {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            padding: 4px 10px;
            border-radius: 24px;
            border: 1px solid #DDE3EC;
            font-size: 0.7rem;
        }
        .stage-num-sm {
            font-weight: 700;
            background: #C3D7FF;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            font-size: 0.65rem;
            flex-shrink: 0;
        }
        .stage-text { flex: 1; color: #1f2f3e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stage-check { font-size: 0.8rem; min-width: 20px; text-align: center; }
        .options-list { display: flex; flex-direction: column; gap: 6px; }
        .option-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            padding: 5px 10px;
            border-radius: 32px;
            border: 1px solid #DDE3EC;
        }
        .option-num {
            font-weight: 700;
            font-size: 0.7rem;
            background: #C3D7FF;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            flex-shrink: 0;
        }
        .option-select { flex: 1; }
        select {
            width: 100%;
            padding: 5px 8px;
            border-radius: 24px;
            border: 1px solid #CDD9ED;
            background: #FFFFFF;
            font-size: 0.7rem;
            font-family: inherit;
            cursor: pointer;
        }
        .option-status {
            font-size: 1rem;
            min-width: 28px;
            text-align: center;
        }
        .btn {
            border: none;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.7rem;
            cursor: pointer;
            background: #C3D7FF;
            color: #1f2f3e;
            margin-top: 8px;
        }
        .locked-warning {
            background: #FFFBEE;
            padding: 10px;
            border-radius: 16px;
            text-align: center;
            font-size: 0.7rem;
            color: #b86f2c;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<div class="sheet" id="pdfContainer">
    <div class="sheet-header">
        <h2>📋 Чек-лист — Что не упустить в начале работы</h2>
        <button id="downloadPdfBtn" class="pdf-btn" style="display: none;">📎 PDF</button>
    </div>
    <div class="sheet-content">
        <div id="accessWarning" class="locked-warning" style="display: block;">⚠️ Сначала завершите первый шаг (последовательность этапов)</div>

        <div id="stagesPreviewSection" class="section">
            <div class="section-header">
                <div class="section-title">🔍 Этапы консультирования</div>
            </div>
            <div id="stagesPreviewList" class="stages-compact"></div>
        </div>

        <div id="contractSection" class="section" style="opacity: 0.5; pointer-events: none;">
            <div class="section-header">
                <div class="section-title">✍️ Выберите обязательные условия, которые вы включите в договор</div>
                <div class="hint-icon tooltip" id="contractHint">💡<span class="tooltip-text" id="contractHintText"></span></div>
            </div>
            <div id="contractList" class="options-list"></div>
        </div>

        <div id="conclusionSection" class="section" style="opacity: 0.5; pointer-events: none;">
            <div class="section-header">
                <div class="section-title">📌 Выберите пункты, которые вы включите в консультационное заключение</div>
                <div class="hint-icon tooltip" id="conclusionHint">💡<span class="tooltip-text" id="conclusionHintText"></span></div>
            </div>
            <div id="conclusionList" class="options-list"></div>
            <button id="checkBtn" class="btn">✓ Проверить</button>
        </div>
    </div>
</div>

<script>
    const CORRECT_STAGES = [
        "Согласовать условия работы", "Заключить договор", "Оформить доверенность при необходимости",
        "Запросить уставные документы", "Узнать систему налогообложения",
        "Узнать, есть ли у клиента претензии или проверки от налоговой",
        "Проанализировать учет и нормы", "Подготовить варианты решения",
        "Обсудить варианты с клиентом и выбрать лучший"
    ];

    const CORRECT_CONTRACT = [
        "Предмет договора",
        "Порядок сдачи-приемки услуг",
        "Права и обязанности сторон",
        "Цена и порядок расчетов",
        "Имущественная ответственность консультанта (оговорка о гарантиях)",
        "Сроки оказания услуг",
        "Конфиденциальность",
        "Форс-мажор и разрешение споров"
    ];

    const ALL_CONTRACT_OPTIONS_UNIQUE = [
        "Предмет договора",
        "Порядок сдачи-приемки услуг",
        "Права и обязанности сторон",
        "Цена и порядок расчетов",
        "Имущественная ответственность консультанта (оговорка о гарантиях)",
        "Сроки оказания услуг",
        "Конфиденциальность",
        "Форс-мажор и разрешение споров",
        "Нотариальное заверение каждой страницы договора",
        "Оплата срочных услуг",
        "Ответственность клиента",
        "Предоставление консультантом справки об отсутствии судимости"
    ];

    const CORRECT_CONCLUSION = [
        "Дата и номер заключения",
        "Перечень документов, предоставленных клиентом",
        "Дисклеймер (ограничение ответственности)",
        "Вывод (резолютивная часть)"
    ];

    const ALL_CONCLUSION_OPTIONS_UNIQUE = [
        "Дата и номер заключения",
        "Перечень документов, предоставленных клиентом",
        "Дисклеймер (ограничение ответственности)",
        "Вывод (резолютивная часть)",
        "Подпись клиента в подтверждение ознакомления",
        "Позиция налогового органа по вопросу клиента",
        "Список внутренних переписок сотрудников компании",
        "Расчет штрафных санкций за нарушение сроков ответа консультанта"
    ];

    let contractSelections = new Array(CORRECT_CONTRACT.length).fill("");
    let conclusionSelections = new Array(CORRECT_CONCLUSION.length).fill("");
    let stageSelections = new Array(9).fill("");
    let isFirstStepCompleted = false;
    let contractHasError = false;
    let conclusionHasError = false;

    const stagesPreview = document.getElementById('stagesPreviewList');
    const contractContainer = document.getElementById('contractList');
    const conclusionContainer = document.getElementById('conclusionList');
    const checkBtn = document.getElementById('checkBtn');
    const accessWarning = document.getElementById('accessWarning');
    const contractSection = document.getElementById('contractSection');
    const conclusionSection = document.getElementById('conclusionSection');
    const downloadBtn = document.getElementById('downloadPdfBtn');
    const contractHint = document.getElementById('contractHint');
    const conclusionHint = document.getElementById('conclusionHint');

    function shuffleArray(arr) {
        const copy = [...arr];
        for (let i = copy.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
    }

    function getAvailableOptionsForContract(selectedValues, currentIdx) {
        const usedValues = new Set();
        for (let i = 0; i < contractSelections.length; i++) {
            if (i !== currentIdx && contractSelections[i] !== "") {
                usedValues.add(contractSelections[i]);
            }
        }
        return ALL_CONTRACT_OPTIONS_UNIQUE.filter(opt => !usedValues.has(opt));
    }

    function getAvailableOptionsForConclusion(selectedValues, currentIdx) {
        const usedValues = new Set();
        for (let i = 0; i < conclusionSelections.length; i++) {
            if (i !== currentIdx && conclusionSelections[i] !== "") {
                usedValues.add(conclusionSelections[i]);
            }
        }
        return ALL_CONCLUSION_OPTIONS_UNIQUE.filter(opt => !usedValues.has(opt));
    }

    function checkAccess() {
        const completed = localStorage.getItem('step1_completed');
        isFirstStepCompleted = (completed === 'true');
        const savedSelections = localStorage.getItem('step1_selections');
        if (savedSelections) {
            try {
                stageSelections = JSON.parse(savedSelections);
                if (!Array.isArray(stageSelections) || stageSelections.length !== 9) stageSelections = new Array(9).fill("");
            } catch(e) { stageSelections = new Array(9).fill(""); }
        }
        
        if (!isFirstStepCompleted) {
            accessWarning.style.display = 'block';
            contractSection.style.opacity = '0.5';
            conclusionSection.style.opacity = '0.5';
            contractSection.style.pointerEvents = 'none';
            conclusionSection.style.pointerEvents = 'none';
            downloadBtn.style.display = 'none';
        } else {
            accessWarning.style.display = 'none';
            contractSection.style.opacity = '1';
            conclusionSection.style.opacity = '1';
            contractSection.style.pointerEvents = 'auto';
            conclusionSection.style.pointerEvents = 'auto';
            downloadBtn.style.display = 'block';
            loadData();
            renderStagesPreview();
            renderContract();
            renderConclusion();
            updateHints();
        }
    }

    function loadData() {
        const saved = localStorage.getItem('checklist_step2');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                contractSelections = data.contractSelections || new Array(CORRECT_CONTRACT.length).fill("");
                conclusionSelections = data.conclusionSelections || new Array(CORRECT_CONCLUSION.length).fill("");
                contractHasError = data.contractHasError || false;
                conclusionHasError = data.conclusionHasError || false;
            } catch(e) {}
        }
        updateHintVisibility();
    }

    function saveData() {
        localStorage.setItem('checklist_step2', JSON.stringify({
            contractSelections, conclusionSelections, contractHasError, conclusionHasError
        }));
    }

    function updateHints() {
        const contractListHtml = `<ul>${CORRECT_CONTRACT.map(item => `<li>${item}</li>`).join('')}</ul>`;
        contractHint.querySelector('.tooltip-text').innerHTML = `✅ Правильные условия для договора:<br>${contractListHtml}`;
        
        const conclusionListHtml = `<ul>${CORRECT_CONCLUSION.map(item => `<li>${item}</li>`).join('')}</ul>`;
        conclusionHint.querySelector('.tooltip-text').innerHTML = `✅ Правильные пункты для заключения:<br>${conclusionListHtml}`;
    }

    function updateHintVisibility() {
        contractHint.style.opacity = contractHasError ? '1' : '0';
        conclusionHint.style.opacity = conclusionHasError ? '1' : '0';
    }

    function renderStagesPreview() {
        stagesPreview.innerHTML = '';
        const flexibleSet = new Set(["Запросить уставные документы", "Узнать систему налогообложения", "Узнать, есть ли у клиента претензии или проверки от налоговой"]);
        const fixedPositions = {1: true, 2: true, 3: true, 7: true, 8: true, 9: true};
        for (let i = 0; i < 9; i++) {
            const val = stageSelections[i] || '—';
            const pos = i+1;
            let isCorrect = false;
            if (fixedPositions[pos]) isCorrect = (val === CORRECT_STAGES[i]);
            else if (pos >= 4 && pos <= 6) isCorrect = (val !== "" && flexibleSet.has(val));
            const displayVal = val.length > 38 ? val.slice(0,35) + '…' : val;
            stagesPreview.innerHTML += `<div class="stage-line"><div class="stage-num-sm">${pos}</div><div class="stage-text" title="${val}">${displayVal}</div><div class="stage-check">${isCorrect && val !== '—' ? '✅' : (val !== '—' ? '❌' : '○')}</div></div>`;
        }
    }

    function updateContractSelectOptions() {
        for (let i = 0; i < CORRECT_CONTRACT.length; i++) {
            const select = document.querySelector(`.contract-select[data-contract-idx="${i}"]`);
            if (select) {
                const currentVal = contractSelections[i];
                const availableOpts = getAvailableOptionsForContract(contractSelections, i);
                const shuffledOpts = shuffleArray([...availableOpts]);
                
                select.innerHTML = '<option value="">--</option>';
                shuffledOpts.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (currentVal === opt) option.selected = true;
                    select.appendChild(option);
                });
            }
        }
    }

    function updateConclusionSelectOptions() {
        for (let i = 0; i < CORRECT_CONCLUSION.length; i++) {
            const select = document.querySelector(`.conclusion-select[data-concl-idx="${i}"]`);
            if (select) {
                const currentVal = conclusionSelections[i];
                const availableOpts = getAvailableOptionsForConclusion(conclusionSelections, i);
                const shuffledOpts = shuffleArray([...availableOpts]);
                
                select.innerHTML = '<option value="">--</option>';
                shuffledOpts.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (currentVal === opt) option.selected = true;
                    select.appendChild(option);
                });
            }
        }
    }

    function renderContract() {
        contractContainer.innerHTML = '';
        for (let i = 0; i < CORRECT_CONTRACT.length; i++) {
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML = `
                <div class="option-num">${i+1}</div>
                <div class="option-select"><select data-contract-idx="${i}" class="contract-select"></select></div>
                <div class="option-status" id="contractIcon${i}"></div>
            `;
            contractContainer.appendChild(row);
        }
        
        for (let i = 0; i < CORRECT_CONTRACT.length; i++) {
            const select = document.querySelector(`.contract-select[data-contract-idx="${i}"]`);
            if (select) {
                const availableOpts = getAvailableOptionsForContract(contractSelections, i);
                const shuffledOpts = shuffleArray([...availableOpts]);
                select.innerHTML = '<option value="">--</option>';
                shuffledOpts.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (contractSelections[i] === opt) option.selected = true;
                    select.appendChild(option);
                });
                
                select.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.contractIdx);
                    const newVal = e.target.value;
                    contractSelections[idx] = newVal;
                    document.getElementById(`contractIcon${idx}`).innerHTML = '';
                    updateContractSelectOptions();
                    saveData();
                });
            }
        }
    }

    function renderConclusion() {
        conclusionContainer.innerHTML = '';
        for (let i = 0; i < CORRECT_CONCLUSION.length; i++) {
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML = `
                <div class="option-num">${i+1}</div>
                <div class="option-select"><select data-concl-idx="${i}" class="conclusion-select"></select></div>
                <div class="option-status" id="conclusionIcon${i}"></div>
            `;
            conclusionContainer.appendChild(row);
        }
        
        for (let i = 0; i < CORRECT_CONCLUSION.length; i++) {
            const select = document.querySelector(`.conclusion-select[data-concl-idx="${i}"]`);
            if (select) {
                const availableOpts = getAvailableOptionsForConclusion(conclusionSelections, i);
                const shuffledOpts = shuffleArray([...availableOpts]);
                select.innerHTML = '<option value="">--</option>';
                shuffledOpts.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt;
                    option.textContent = opt;
                    if (conclusionSelections[i] === opt) option.selected = true;
                    select.appendChild(option);
                });
                
                select.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.conclIdx);
                    const newVal = e.target.value;
                    conclusionSelections[idx] = newVal;
                    document.getElementById(`conclusionIcon${idx}`).innerHTML = '';
                    updateConclusionSelectOptions();
                    saveData();
                });
            }
        }
    }

    function verifyChecklist() {
        if (!isFirstStepCompleted) return;

        const contractSet = new Set(CORRECT_CONTRACT);
        let contractAllCorrect = true;
        for (let i = 0; i < CORRECT_CONTRACT.length; i++) {
            const val = contractSelections[i];
            const isCorrect = contractSet.has(val);
            const icon = document.getElementById(`contractIcon${i}`);
            if (icon) {
                if (isCorrect && val !== "") {
                    icon.innerHTML = '✅';
                } else if (val !== "") {
                    icon.innerHTML = '❌';
                    contractAllCorrect = false;
                } else {
                    icon.innerHTML = '';
                    contractAllCorrect = false;
                }
            }
        }

        const conclusionSet = new Set(CORRECT_CONCLUSION);
        let conclusionAllCorrect = true;
        for (let i = 0; i < CORRECT_CONCLUSION.length; i++) {
            const val = conclusionSelections[i];
            const isCorrect = conclusionSet.has(val);
            const icon = document.getElementById(`conclusionIcon${i}`);
            if (icon) {
                if (isCorrect && val !== "") {
                    icon.innerHTML = '✅';
                } else if (val !== "") {
                    icon.innerHTML = '❌';
                    conclusionAllCorrect = false;
                } else {
                    icon.innerHTML = '';
                    conclusionAllCorrect = false;
                }
            }
        }

        // Обновляем состояние ошибок для лампочек
        if (!contractAllCorrect) {
            contractHasError = true;
        } else {
            contractHasError = false;
        }
        
        if (!conclusionAllCorrect) {
            conclusionHasError = true;
        } else {
            conclusionHasError = false;
        }

        updateHintVisibility();
        saveData();
    }

    function downloadPDF() {
        html2pdf().set({ margin: 0.5, filename: 'cheklist_nachalo_raboty.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } }).from(document.getElementById('pdfContainer')).save();
    }

    checkBtn.addEventListener('click', verifyChecklist);
    downloadBtn.addEventListener('click', downloadPDF);
    checkAccess();
    window.addEventListener('storage', checkAccess);
</script>
</body>
</html>
